name=Quectel_LC76G
version=1.0.0
author=Ugo Silato
maintainer=Ugo Silato <ugo.silato@hotmail.com>
sentence=Complete driver for the Quectel LC76G GNSS module (LC26G/LC76G/LC86G protocol family), over UART or I2C.
paragraph=Tested on Arduino Uno R3 and Uno R4 Minima. Integer-only NMEA decoder (RMC, GGA, GSV), PAIR and PQTM commands, automatic UART baud rate configuration, PQTM output messages (PVT, velocity, DOP, odometer, GPS time, ECEF), constellations, jamming detection, geofence, 1PPS, low power modes, AGNSS (EASY/EPOC), LOCUS logger, reception and output settings, safe power and reset pin control.
category=Sensors
url=https://github.com/ugo-silato/Quectel_LC76G
architectures=avr,renesas_uno
includes=Quectel_LC76G.h
