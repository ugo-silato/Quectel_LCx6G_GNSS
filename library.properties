name=Quectel_LCx6G_GNSS
version=1.0.0
author=Ugo Silato
maintainer=Ugo Silato <ugo.silato@hotmail.com>
sentence=Driver for Quectel LC26G, LC26G-T, LC76G and LC86G GNSS modules (GPS, GLONASS, Galileo, BeiDou, QZSS): NMEA, PAIR/PQTM commands, UART or I2C. Tested on LC76G with Arduino Uno R3 and R4.
paragraph=Developed and tested on the LC76G (PA) with Arduino Uno R3 and Uno R4 Minima; the other modules share the same Quectel protocol (compatible, not tested). Integer-only NMEA decoder (RMC, GGA, GSV), PAIR and PQTM commands, automatic UART baud rate configuration, PQTM output messages (PVT, velocity, DOP, odometer, GPS time, ECEF), constellations, jamming detection, geofence, 1PPS, low power modes, AGNSS (EASY/EPOC), LOCUS logger, reception and output settings, safe power and reset pin control.
category=Sensors
url=https://github.com/ugo-silato/Quectel_LCx6G_GNSS
architectures=avr,renesas_uno
includes=Quectel_LC76G.h
